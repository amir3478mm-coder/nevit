[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nevit"
version = "6.0.6"
description = "کتابخانه قدرتمند ساخت ربات در پیام‌رسان بله"
readme = "README.md"
authors = [{name = "Nevit Team"}]
license = {text = "MIT"}
requires-python = ">=3.7"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["nevit*"]